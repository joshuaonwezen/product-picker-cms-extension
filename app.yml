meta:
  app_id: cms_product_picker
  display_name: Product picker
  version: 0.0.1-dev.5
  vendor: optimizely
  summary: Pick a product from your site's product catalog right in the CMS editor.
  support_url: https://www.optimizely.com
  contact_email: joshua.onwezen@optimizely.com
  categories:
    - Testing & Utilities
  availability:
    - all

runtime: node22-cms-ext

functions:
  cms_extension:
    entry_point: CmsUiExtension
    description: Reads the site's product catalog for the picker.
    accepts: cms_ui_extension

ui_extensions:
  property-editor:
    # Offered for long strings (string, no format). The CMS mounts it only where an admin
    # picks it: content type -> property -> User Interface -> Editor: Product picker.
    - name: product-picker
      entry_point: ProductPicker
      display_name: Product picker
      metadata:
        property_type: string
