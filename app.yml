meta:
  app_id: cms_product_picker
  display_name: Product picker
  version: 0.0.1-dev.0
  vendor: optimizely
  summary: Pick a bank product from the site's product catalog API right in the CMS editor.
  support_url: https://www.optimizely.com
  contact_email: joshua.onwezen@optimizely.com
  categories:
    - Testing & Utilities
  availability:
    - all

runtime: node22-cms-ext

functions:
  cms_extension:
    entry_point: CmsUiExtension
    description: Reads the open item's content type (CMS REST) and the site's product catalog.
    accepts: cms_ui_extension

ui_extensions:
  property-editor:
    # Long strings (string, no format) are the only kind the CMS mounts property editors
    # on, and the editor lands on every one of them. It becomes the picker only on the
    # content types named in settings; everywhere else it is a plain text field.
    - name: product-picker
      entry_point: ProductPicker
      display_name: Product picker
      metadata:
        property_type: string
