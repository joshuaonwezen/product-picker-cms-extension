sections:
  - key: catalog
    label: Product catalog
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          The site whose /api/catalog/products lists the products, e.g.
          https://optimizely-onboarding.vercel.app.
      - type: text
        key: contentTypes
        label: Content types with the picker
        help: >-
          Comma-separated content type keys whose long-string field becomes the product
          picker. Leave blank for ProductSpotlight. Everywhere else the field stays a plain
          text field.
      - type: button
        label: Save
        action: saveCatalog
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          CMS → Settings → API Keys. Used to look up the open item's content type.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once when the API key is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
