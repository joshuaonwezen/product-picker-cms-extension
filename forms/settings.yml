sections:
  - key: catalog
    label: Product catalog
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          Your site's address, e.g. https://www.example.com. The catalog is read from
          /api/catalog/products on that site, and saving checks that it lists products.
      - type: button
        label: Save
        action: saveCatalog
        style: primary
